name: Fetch site photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/fetch-images.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos from Wikimedia Commons
        run: |
          mkdir -p images
          get() {
            curl -fsSL -A "sguven-cv-site/1.0 (https://github.com/sguven/deneme)" \
              "https://commons.wikimedia.org/wiki/Special:FilePath/$2?width=1400" -o "images/$1"
            file "images/$1"
          }
          get barclays.jpg "Barclays_-_NYC_Headquarters_(48105882878).jpg"
          get qnb.jpg "QNB_Finansbank_Kristal_Kule_2.jpg"
          get bogazici.jpg "Bo%C4%9Fazi%C3%A7i_%C3%9Cniversitesi_G%C3%BCney_kap%C4%B1s%C4%B1.JPG"
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet || git commit -m "Add institution photos from Wikimedia Commons"
          git push
